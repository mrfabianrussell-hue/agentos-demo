 arm:['Why did my interest rate change?','Compare the adjustment notice with the prior and new rate, payment, effective date, and loan terms.','Use the loan’s actual index, margin, and caps.',['Review the adjustment notice.','Reconcile the rate and payment change.','Explain the effective date and any unresolved discrepancy.']],
 payoff:['How do I get a payoff quote?','Confirm the requested payoff date and authorized delivery recipient.','A principal balance is not a payoff quote.',['Check authorized-party status.','Request the quote for the correct date.','Explain the quote validity and approved remittance instructions.']],
 assumption:['Can someone take over this loan?','Check whether the loan has an available assumption path before discussing next steps.','Do not promise approval or release of liability.',['Review the loan program and transfer request.','Locate approved eligibility and application requirements.','Route the request to the designated team.']],
 statement:['Can you send my statement or a document?','Select the exact document and period, then confirm the permitted recipient and delivery method.','Use an approved document and verified destination.',['Confirm the document type and date range.','Locate the available document.','Confirm delivery preference and record the request.']],
 contact:['How do I update my contact details?','Confirm which details changed and the caller’s authority to update them.','Follow required identity checks before making changes.',['Review current details with appropriate masking.','Validate the new information.','Confirm the saved change and any required notification.']],
 lossmit:['What help is available if I cannot pay?','Identify the borrower’s immediate concern and review any existing assistance case.','Do not promise eligibility or an outcome.',['Check open applications and prior contact.','Use the approved hardship intake questions.','Explain the confirmed application or specialist next step.']],
 forbearance:['What happens during or after my forbearance?','Review the actual agreement, end date, and any confirmed next steps.','Do not infer how deferred amounts will be repaid.',['Review plan terms and status.','Check pending review or follow-up.','Explain only the options confirmed by the assistance team.']],
 bankruptcy:['Who can discuss this account?','Review the account’s communication restrictions and authorized contact before discussing servicing options.','Account-specific handling must come from the approved specialist procedure.',['Review the bankruptcy flag and contact restrictions.','Confirm authorized recipient and permitted discussion.','Route to the designated specialist when required.']],
 deceased:['What is needed after a borrower passes away?','Acknowledge the loss and identify the caller’s relationship and purpose.','Do not assume access or authority from the relationship alone.',['Review any existing successor or estate case.','Locate approved documentation requirements.','Explain the submission channel and next review step.']],
 fraud:['I do not recognize a transaction or account change.','Identify the disputed event and preserve the reported details for specialist review.','Use approved identity and fraud procedures before making further changes.',['Capture the transaction or change date and amount.','Review relevant recent activity.','Route the concern through the designated fraud process.']],
 complaint:['I want to make a complaint.','Capture the concern, desired resolution, and any existing case before deciding the next action.','Do not assume the complaint is resolved because an explanation was provided.',['Acknowledge the specific concern.','Review prior handling and available resolution authority.','Document the outcome or escalate with complete context.']],
 online:['I cannot sign in to my online account.','Identify whether the problem involves enrollment, credentials, a locked account, or a site error.','Do not request passwords or one-time security codes.',['Identify the error without collecting credentials.','Use the approved recovery path.','If unsuccessful, prepare digital-support research with the error and time.']],
 payment:['I want to make a payment.','Confirm the amount, effective date, and approved funding source before starting payment authorization.','This prototype cannot collect payment credentials or submit a payment.',['Review the account balance and requested allocation.','Use the approved payment service and exact authorization script.','Confirm the recorded transaction result before describing it as complete.']]
};
const terms={escrow:'payment went up higher increase changed expensive tax insurance analysis',shortage:'shortfall deficit negative balance lump sum pay full spread twelve months lower payment',payment_research:'missing lost payment not showing taken twice double duplicate debit pending posted bank deducted',payment:'pay mortgage submit make payment',fees:'late charge fee waive waiver',pmi:'remove cancel mortgage insurance',online:'login log in sign in password locked portal',damage:'storm hurricane damage claim check endorsement',deceased:'died death estate successor',lossmit:'hardship struggling cannot afford unemployment'};
const topics=WORKFLOWS.flatMap(w=>w.id==='escrow'?[{...w,name:'Payment Increase',question:'Why did my payment go up?'},{id:'shortage',name:'Escrow Shortage Options',category:'Escrow',icon:'🏠',question:'Can I pay my shortage in full?'}]:[{...w,question:briefs[w.id]?.[0]||'Where is my payment?'}]);
function state(id=current){return states[id]??=( {scenario:id==='payment_research'?'pending':'increase',notes:'',get conditions(){return callConditions},set conditions(value){callConditions=value}} )}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function nav(){let html='<button data-home>⌂ Frequent questions</button>';for(const category of [...new Set(topics.map(t=>t.category))]){html+='<h3>'+esc(category)+'</h3>';html+=topics.filter(t=>t.category===category).map(t=>`<button data-topic="${t.id}" ${current===t.id?'aria-current="page" class="active"':''}>${t.icon} ${esc(t.name)}</button>`).join('')}$('#nav').innerHTML=html}
function openTopic(id){current=id;state();recent=[id,...recent.filter(x=>x!==id)].slice(0,5);$('#search').value='';search('');nav();render();$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#main').scrollIntoView({block:'start'});$('#pageTitle').focus({preventScroll:true})}
function home(){current=null;nav();render();search($('#search').value)}
function cards(ids){return ids.map(id=>{let t=topics.find(t=>t.id===id);return `<button class="card" data-topic="${id}"><div>${t.icon}</div><strong>${esc(t.question)}</strong><span>${esc(t.name)}</span></button>`}).join('')}
function render(){if(!current){$('#content').innerHTML=`<div class="topline"><div><div class="eyebrow">Agent workspace</div><h1>What does the customer need?</h1><div class="muted">Choose a question or search using the customer’s words.</div></div><button data-new>New test call</button></div>${recent.length?`<div class="recent"><h3>Topics in this call</h3><div class="chips">${recent.map(id=>`<button data-topic="${id}">${esc(topics.find(t=>t.id===id).name)}</button>`).join('')}</div></div>`:''}<div class="cards">${cards(['escrow','shortage','payment_research','payment','taxes','statement'])}</div><div class="panel" style="margin-top:20px"><h3>Try the updated experience</h3><p>Select one of the first three questions, then change its test scenario. Switch topics and return: your selections and notes stay in place for this call.</p><p class="helper">The remaining topics contain draft handling prompts. Approved procedures and live account data are not connected.</p></div>${logHtml()}`;return}
let t=topics.find(t=>t.id===current),s=state(),detailed=['escrow','shortage','payment_research'].includes(current);
$('#content').innerHTML=`<div class="topline"><div><div class="eyebrow">${esc(t.category)} / ${detailed?'Detailed test scenario':'Draft handling guide'}</div><h1 id="pageTitle" tabindex="-1">${esc(t.name)}</h1></div><div class="rightActions"><button data-home>All questions</button><button data-new>New test call</button></div></div>
${detailed?`<div class="panel testbar"><label for="scenario">Test scenario</label><select id="scenario">${Object.entries(scenarios).filter(([key])=>current==='payment_research'?['pending','posted','absent','duplicate'].includes(key):['increase','insurance','missing'].includes(key)).map(([key,v])=>`<option value="${key}" ${s.scenario===key?'selected':''}>${esc(v.label)}</option>`).join('')}</select></div>`:''}
<div class="bodygrid"><section><div id="alerts">${alerts()}</div>${answer()}<div class="panel"><h3>Conditions that may change handling</h3><div class="chips">${['Tax notice received','Possible duplicate debit','Represented by counsel','Complaint raised'].map(c=>`<button data-condition="${c}" aria-pressed="${s.conditions.includes(c)}" class="${s.conditions.includes(c)?'active':''}">${esc(c)}</button>`).join('')}</div><p class="helper">Select confirmed conditions. These prompts do not automatically assess account restrictions.</p><details><summary>Optional customer words / notes</summary><label for="notes" class="helper">Mock information only; retained while this page stays open.</label><textarea id="notes" placeholder="Add a detail only when the options above do not cover it…">${esc(s.notes)}</textarea><button id="checkContext">Suggest conditions from notes</button><p id="suggestionStatus" class="helper" role="status"></p><div id="suggestions" class="chips"></div></details></div></section>
<aside><div class="panel"><h3>Account context <span class="pill">Sample</span></h3><div class="facts">${facts()}</div><div style="margin-top:12px"><label for="auth" class="helper">Simulated authentication</label><select id="auth"><option value="yes" ${authenticated?'selected':''}>Verified — test value</option><option value="no" ${!authenticated?'selected':''}>Not verified — test value</option></select></div></div><div class="panel"><h3>Related questions</h3><div class="chips">${(current==='escrow'?['shortage','taxes','insurance']:current==='shortage'?['escrow','payment']:current==='payment_research'?['payment','fees']:['escrow','payment_research','statement']).filter(id=>id!==current).map(id=>`<button data-topic="${id}">${esc(topics.find(t=>t.id===id).name)}</button>`).join('')}</div></div>${logHtml()}</aside></div>`;
}
function calc(s){let v=scenarios[s.scenario],old=v.pi+v.taxOld+v.insOld,repay=v.shortage/v.months,total=v.taxNew===null?null:v.pi+v.taxNew+v.insNew+repay;return{...v,old,repay,total,delta:total===null?null:total-old}}
function facts(){let rows=[['Loan','DEMO • 4821'],['Data source','Fictional test account']];if(['escrow','shortage'].includes(current)){let c=calc(state());rows.push(['Prior payment',money(c.old)],['New payment',c.total===null?'Not confirmed':money(c.total)],['Effective date','Oct 1, 2026'],['Shortage',money(c.shortage)])}else if(current==='payment_research'){let d=scenarios[state().scenario];rows.push(['Payment amount',money(d.amount)],['Payment date',d.date],['Record status',d.status],['Reference',d.trace])}else{rows.push(['Account facts','Not connected'],['Policy source','Not connected'])}return rows.map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}
function alerts(){let list=[];if(!authenticated)list.push(['Authentication not verified — test value','Complete the approved identity process before account-specific discussion or action. Simulated actions are disabled.']);for(let c of state().conditions){let map={'Tax notice received':'Compare the notice with the disbursement record and prepare tax research if they conflict.','Possible duplicate debit':'Review both transactions before recommending another payment.','Represented by counsel':'Check the approved communication restrictions before continuing.','Complaint raised':'Capture the concern and desired resolution; check for an existing case.'};list.push([c,map[c]])}if(current==='payment_research'&&state().scenario==='duplicate'&&!state().conditions.includes('Possible duplicate debit'))list.push(['Possible duplicate debit — sample account condition','Two reported debits require comparison. The sample records do not establish that both settled.']);return list.map(([a,b])=>`<div class="alert"><strong>${esc(a)}</strong><p>${esc(b)}</p></div>`).join('')}
function comparison(c){return `<div class="scroll"><table><caption class="helper" style="text-align:left">Monthly payment breakdown • sample amounts</caption><thead><tr><th scope="col">Component</th><th scope="col">Prior</th><th scope="col">New</th><th scope="col">Change</th></tr></thead><tbody>${[['Principal & interest',c.pi,c.pi],['Taxes',c.taxOld,c.taxNew],['Insurance',c.insOld,c.insNew],['Shortage repayment',0,c.repay]].map(([label,a,b])=>`<tr><th scope="row">${label}</th><td>${money(a)}</td><td>${b===null?'Missing':money(b)}</td><td>${b===null?'Unknown':(b-a>0?'+':'')+money(b-a)}</td></tr>`).join('')}</tbody><tfoot><tr><th scope="row">Total</th><td>${money(c.old)}</td><td>${c.total===null?'Not confirmed':money(c.total)}</td><td>${c.delta===null?'Unknown':'+'+money(c.delta)}</td></tr></tfoot></table></div>`}
function answer(){let title='',explain='',say='',detail='',steps=[],actions=[];let s=state();
if(current==='escrow'){let c=calc(s);title=c.total===null?'The full payment change cannot be confirmed.':`Your monthly payment increases ${money(c.delta)} on October 1.`;explain=c.total===null?'The new tax amount is missing. Confirm the analysis before providing a total or attributing the entire increase.':c.shortage?`Taxes add ${money(c.taxNew-c.taxOld)}, insurance adds ${money(c.insNew-c.insOld)}, and shortage repayment adds ${money(c.repay)} per month.`:`The increase comes from insurance: ${money(c.insNew-c.insOld)} more per month. This sample has no shortage.`;say=c.total===null?'I can see the insurance change and shortage amount, but I need to confirm the tax information before giving you a complete explanation.':`Your payment changes from ${money(c.old)} to ${money(c.total)} effective October 1. ${explain} ${c.shortage?'The shortage is separate from the ongoing cost of taxes and insurance.':''}`;detail=comparison(c);steps=['Confirm the effective date and reconcile the components to the analysis.','Explain recurring tax and insurance changes separately from shortage repayment.','Review supported options or provide the analysis.'];actions=['Send analysis','Research discrepancy'];}
else if(current==='shortage'){let c=calc(s);title=!c.shortage?'There is no shortage in this sample account.':!c.eligible?'Shortage options need confirmation.':`The sample shortage is ${money(c.shortage)}.`;explain=!c.shortage?'A higher insurance premium can increase the payment even when there is no shortage.':!c.eligible?'The example does not have confirmed eligibility. Review the analysis before quoting repayment options.':`This test account allows ${money(c.repay)} per month over ${c.months} months, or a payment of the full ${money(c.shortage)} shortage.`;say=!c.shortage?'This analysis does not show a shortage. The payment change is due to the ongoing insurance cost.':!c.eligible?'I can see a shortage, but I need to verify the options available on your account before explaining the next step.':`Your shortage is ${money(c.shortage)}. In this example, it can be spread over ${c.months} months at ${money(c.repay)} per month, or paid in full. Paying it in full does not remove the higher ongoing tax and insurance costs. We would confirm when any payment adjustment takes effect.`;detail=c.eligible?`<div class="facts"><div class="fact"><span>Spread over ${c.months} months</span><strong>${money(c.total)} / month</strong><span>Includes ${money(c.repay)} shortage repayment</span></div><div class="fact"><span>After full shortage payment</span><strong>${money(c.total-c.repay)} / month*</strong><span>*Illustrative recalculated amount; effective date must be confirmed.</span></div></div>`:'';steps=['Verify shortage balance and loan-specific options in the approved analysis.','Confirm the requested allocation and the effective date of any recalculation.','Use the approved payment process if the borrower elects to pay.'];actions=c.eligible?['Prepare shortage payment','Send analysis']:['Research discrepancy'];}
else if(current==='payment_research'){let d=scenarios[s.scenario];const content={pending:['The sample payment is pending.','A payment request is recorded, but it is not confirmed as posted.','I can see a payment request for $2,100 dated September 8. It is currently pending. I will check the processing details before confirming when it will post.'],posted:['The sample payment is posted.','Match the amount, date, and allocation to the payment the borrower is asking about.','The account shows a posted payment of $2,100 dated September 8. Let’s confirm that it matches the payment you are asking about.'],absent:['The reported payment is not located in the sample record.','A missing servicing record does not prove that the borrower’s bank did not debit the payment.','I do not see that payment in the available record. Let’s compare the amount, date, and bank reference so we can research it.'],duplicate:['A possible duplicate payment needs research.','Two debits are reported. Verify both references and statuses before concluding that there is a duplicate settled payment.','You are reporting two debits. I will compare both transactions and their status before recommending another payment or discussing a correction.']};[title,explain,say]=content[s.scenario];detail=`<div class="facts"><div class="fact"><span>Payment</span><strong>${money(d.amount)}</strong></div><div class="fact"><span>Status</span><strong>${esc(d.status)}</strong></div></div>`;steps=['Compare amount, effective date, payment channel, and reference.','Check posting and allocation records against the reported debit.','Prepare research if the records do not establish the outcome; do not invent a completion date.'];actions=['Prepare payment research','Send status summary'];}
else{let b=briefs[current];title=b[0];explain=b[1];say='';detail=`<div class="alert"><strong>Draft guidance • account data unavailable</strong><p>${esc(b[2])} Use the approved procedure before acting.</p></div>`;steps=b[3];actions=['Prepare research','Prepare escalation'];}
return `<article class="panel answer"><div class="eyebrow">${['escrow','shortage','payment_research'].includes(current)?'Answer from sample data':'Handling prompt'}</div><h2>${esc(title)}</h2><p>${esc(explain)}</p>${say?`<div class="say"><h3>Suggested wording <small>Draft</small></h3><div id="wording">${esc(say)}</div><button data-copy style="margin-top:10px">Copy wording</button></div>`:''}${detail}<div class="actions">${actions.map(a=>`<button data-action="${esc(a)}" ${!authenticated?'disabled':''} class="${a===actions[0]?'primary':''}">${esc(a)} <small style="color:inherit">· Demo</small></button>`).join('')}</div><details><summary>Handling details</summary><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="helper">These instructions are readable without marking steps complete.</p></details><button data-source>View draft source / assumptions</button></article>`}
function logHtml(){return `<div class="panel"><h3>This call’s demo actions</h3>${callLog.length?`<ol class="log">${callLog.map(a=>`<li>${esc(a)}</li>`).join('')}</ol>`:'<p class="helper">No actions recorded. Topic selections and notes remain available until you start a new test call or reload.</p>'}</div>`}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function matches(query){let words=normalize(query).split(' ').filter(w=>!['my','the','a','is','why','did','i','to','of','can','you','it','has','was','do'].includes(w));if(!words.length)return[];return topics.map(t=>{let body=normalize([t.name,t.question,terms[t.id]||'',...(briefs[t.id]||[]).flat(),...(t.steps||[]).map(s=>s.instruction)].join(' '));let score=words.reduce((n,w)=>n+(body.includes(w)?1:0),0);return{t,score}}).filter(x=>x.score>=Math.max(1,Math.ceil(words.length*.5))).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.t)}
function search(q){let box=$('#results');if(!q.trim()){box.classList.add('hidden');box.innerHTML='';return}let m=matches(q);box.classList.remove('hidden');box.innerHTML=`<strong role="status">${m.length?`${m.length} matching topics`:'No matching topics'}</strong>${m.length?m.map(t=>`<button data-topic="${t.id}">${esc(t.question)}<small>${esc(t.name)}</small></button>`).join(''):'<p>Try “shortage,” “payment pending,” or choose a category from Topics.</p>'}<small>Search covers draft guidance and customer-language keywords. It does not retrieve approved policy.</small>`}
function modal(title,body,actions=[]){returnFocus=document.activeElement;$('#dialogTitle').textContent=title;$('#dialogText').textContent=body;$('#dialogActions').replaceChildren();actions.forEach(({label,run})=>{let b=document.createElement('button');b.textContent=label;b.className='primary';b.onclick=run;$('#dialogActions').appendChild(b)});$('#dialog').showModal()}
function closeModal(){$('#dialog').close();if(returnFocus?.isConnected)returnFocus.focus()}
function action(name){let t=topics.find(t=>t.id===current),s=state(),wording=$('#wording')?.textContent||briefs[current]?.[1]||'',send=name.startsWith('Send'),pay=name.includes('payment')&&name.includes('shortage');let body=`DEMO PREVIEW — nothing will be submitted.\n\nTopic: ${t.name}\n${['escrow','shortage','payment_research'].includes(current)?'Scenario: '+scenarios[s.scenario].label+'\n':''}\n${wording}\n\n${s.conditions.length?'Confirmed test conditions: '+s.conditions.join(', ')+'\n':''}${s.notes?'Mock notes: '+s.notes+'\n':''}\n${send?'Delivery preview: approved document or status summary to a verified destination. No recipient is connected.':pay?'Payment handoff preview: full sample shortage '+money(calc(s).shortage)+'. Funding source and authorization must be collected in the approved payment service. No transaction is created.':'Research / escalation draft: include transaction details, supporting records, customer concern, and requested resolution. Destination and service deadline are not connected.'}`;modal(name+' • preview',body,[{label:'Record demo action',run:()=>{callLog.push(`${t.name}: ${name} (simulated only)`);closeModal();render();toast('Demo action recorded. Nothing was sent.')}}])}
function suggest(){let n=normalize(state().notes),rules=[['Tax notice received',/tax.*(notice|delinquen|overdue)|delinquen.*tax/],['Possible duplicate debit',/duplicate|twice|double|two debits/],['Represented by counsel',/attorney|counsel|lawyer/],['Complaint raised',/complaint|regulator|unhappy/]],hits=rules.filter(([c,re])=>re.test(n)&&!state().conditions.includes(c));$('#suggestionStatus').textContent=hits.length?'Possible matches only. Select a condition to confirm it applies.':'No additional keyword suggestions. This does not rule out an exception; review account restrictions.';$('#suggestions').innerHTML=hits.map(([c])=>`<button data-condition="${c}">Confirm: ${c}</button>`).join('')}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.topic){openTopic(b.dataset.topic);return}if(b.hasAttribute('data-home')){home();return}if(b.dataset.condition){let s=state(),c=b.dataset.condition;s.conditions=s.conditions.includes(c)?s.conditions.filter(x=>x!==c):[...s.conditions,c];render();document.querySelector(`[data-condition="${c}"]`)?.focus();return}if(b.dataset.action){action(b.dataset.action);return}if(b.hasAttribute('data-source')){modal('Draft source / assumptions','No approved servicing manual is connected.\n\nThe original mock policy section and page references have been removed because they were not verified.\n\nDetailed examples use fictional account data. Payment totals equal principal and interest + monthly taxes + monthly insurance + shortage repayment. The shortage example assumes a 12-month spread and specifically configured sample eligibility. A payment recalculation date must be confirmed. Payment-research statuses are selected test scenarios, not live records.\n\nProduction guidance needs an approved document, exact excerpt, section, version or effective date, and loan-specific applicability. Other topics are draft handling prompts.');return}if(b.hasAttribute('data-copy')){let value=$('#wording').textContent;try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(value);toast('Draft wording copied')}catch{modal('Copy draft wording',value);let range=document.createRange();range.selectNodeContents($('#dialogText'));window.getSelection().removeAllRanges();window.getSelection().addRange(range)}return}if(b.hasAttribute('data-new'))modal('Start a new test call?','This clears this call’s topic selections, notes, conditions, and demo action history.',[{label:'Start new test call',run:()=>{states={};recent=[];callLog=[];callConditions=[];authenticated=true;clearHandoff();$('#search').value='';closeModal();home();toast('New test call started')}}]);if(b.id==='checkContext')suggest()});
$('#search').addEventListener('input',e=>search(e.target.value));$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){let first=matches(e.target.value)[0];if(first)openTopic(first.id)}});$('#clearSearch').onclick=()=>{$('#search').value='';search('');$('#search').focus()};$('#theme').onclick=()=>{$('body').classList.toggle('dark');$('#theme').setAttribute('aria-pressed',$('body').classList.contains('dark'))};$('#menu').onclick=()=>{$('#nav').classList.toggle('open');$('#menu').setAttribute('aria-expanded',$('#nav').classList.contains('open'))};$('#closeDialog').onclick=closeModal;
document.addEventListener('input',e=>{if(e.target.id==='notes'&&current)state().notes=e.target.value});document.addEventListener('change',e=>{if(e.target.id==='scenario'){state().scenario=e.target.value;render();$('#scenario').focus()}if(e.target.id==='auth'){authenticated=e.target.value==='yes';render();$('#auth').focus()}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'&&!$('#dialog').open){$('#search').value='';search('')}});nav();render();

// Controlled, non-sensitive routing values only. No account data or authentication is accepted from URLs.
const INTENT_MAP={payment_increase:'escrow',escrow:'escrow',escrow_shortage:'shortage',shortage:'shortage',make_payment:'payment',payment_research:'payment_research',missing_payment:'payment_research',property_taxes:'taxes',homeowners_insurance:'insurance',payment_question:null};
function resolveIntent(raw){const value=String(raw||'').trim().toLowerCase();if(Object.prototype.hasOwnProperty.call(INTENT_MAP,value))return INTENT_MAP[value];return topics.some(t=>t.id===value)?value:null}
function clearHandoff(){document.querySelector('#handoff').classList.add('hidden');document.querySelector('#handoff').replaceChildren();try{const u=new URL(window.location.href);u.search='';u.hash='';window.history.replaceState(null,'',u.href)}catch{}}
function receiveUrlContext(){const params=new URLSearchParams(window.location.search);if(!params.has('intent'))return;const raw=params.get('intent')||'',id=resolveIntent(raw);states={};recent=[];callLog=[];callConditions=[];authenticated=false;
if(id)openTopic(id);else home();
const panel=document.querySelector('#handoff');panel.classList.remove('hidden');panel.replaceChildren();const title=document.createElement('strong');title.textContent=id?'IVR topic received: '+topics.find(t=>t.id===id).name:'IVR reason needs clarification';panel.appendChild(title);
const note=document.createElement('p');note.className='helper';note.textContent='Connector test • Topic selection only. Account data and authentication are not supplied by this link. All displayed amounts remain fictional.';panel.appendChild(note);
if(!id){const hint=document.createElement('p');hint.textContent=raw.trim().toLowerCase()==='payment_question'?'Ask which payment question the customer needs help with.':'The intent is missing or unrecognized. Select the correct topic; no answer has been inferred.';panel.appendChild(hint);const choices=document.createElement('div');choices.className='chips';const ids=raw.trim().toLowerCase()==='payment_question'?['payment','payment_research','escrow']:['escrow','shortage','payment_research'];for(const topicId of ids){const b=document.createElement('button');b.dataset.topic=topicId;b.textContent=topics.find(t=>t.id===topicId).name;choices.appendChild(b)}panel.appendChild(choices)}
}
receiveUrlContext();window.addEventListener('popstate',receiveUrlContext);
</script></body></html>
